name: Build and Publish Debian Package

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pages: write
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from control file
        id: get_version
        run: |
          VERSION=$(grep '^Version:' package/DEBIAN/control | awk '{print $2}' | tr -d ' \r\n')
          if [ -z "$VERSION" ]; then
            echo "Erreur : Champ 'Version:' introuvable dans package/DEBIAN/control" >&2
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "TAG=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Version cible : ${VERSION}"

      - name: Build Debian package
        run: |
          ls -la
          chmod +x ./build_deb.sh
          bash -x ./build_deb.sh

      - name: Create GitHub Release and Upload Deb
        uses: softprops/action-gh-release@v2
        with:
          files: apt-auto-update.deb
          tag_name: ${{ steps.get_version.outputs.TAG }}
          name: Release ${{ steps.get_version.outputs.TAG }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate APT repository and publish to GitHub Pages
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq apt-utils gpg git

          # 1. Préparation de l'arborescence du dépôt APT
          mkdir -p repo/dists/stable/main/binary-amd64
          mkdir -p repo/pool/main

          # Copie du binaire .deb dans le pool
          cp apt-auto-update.deb repo/pool/main/

          cd repo

          # 2. Génération de Packages et Packages.gz
          apt-ftparchive packages pool/main > dists/stable/main/binary-amd64/Packages
          gzip -k -f dists/stable/main/binary-amd64/Packages

          # 3. Génération du fichier Release
          # apt-ftparchive release dists/stable > dists/stable/Release
          apt-ftparchive -o APT::FTPArchive::Release::Suite="stable" -o APT::FTPArchive::Release::Codename="stable" release dists/stable > dists/stable/Release

          # 4. Importation de la clé GPG et signature du dépôt
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            echo "$GPG_PRIVATE_KEY" | gpg --batch --import

            # Export de la clé publique pour les clients
            KEY_ID=$(gpg --list-secret-keys --keyid-format LONG | awk '/sec/{print $2}' | cut -d'/' -f2 | head -n1)
            gpg --armor --export "$KEY_ID" > public.key

            # Signature du fichier Release (InRelease et Release.gpg)
            PASSPHRASE_OPT=""
            if [ -n "$GPG_PASSPHRASE" ]; then
              PASSPHRASE_OPT="--pinentry-mode loopback --passphrase $GPG_PASSPHRASE"
            fi

            gpg --batch --yes $PASSPHRASE_OPT --clearsign -o dists/stable/InRelease dists/stable/Release
            gpg --batch --yes $PASSPHRASE_OPT -abs -o dists/stable/Release.gpg dists/stable/Release
          fi

          # 5. Ajout du script install.sh à la racine du site
          cp ../install.sh ./install.sh

          # 6. Déploiement propre sur la branche gh-pages
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b gh-pages
          git add .
          git commit -m "Deploy APT repository and install.sh"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
